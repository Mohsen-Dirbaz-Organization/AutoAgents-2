<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAgents System Reference</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            background: #f8f9fa;
            padding: 25px;
            border-bottom: 2px solid #e9ecef;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .filter-select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: #f8f9fa;
            border: 2px solid #ddd;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn:first-child {
            border-radius: 8px 0 0 8px;
        }

        .toggle-btn:last-child {
            border-radius: 0 8px 8px 0;
        }

        .toggle-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .clear-filters {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .clear-filters:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .content {
            padding: 30px;
        }

        .term-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }

        .term-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .term-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .term-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .term-header {
            margin-bottom: 15px;
        }

        .term-name {
            font-size: 1.4em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .term-category {
            display: inline-block;
            background: #e3f2fd;
            color: #1565c0;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .term-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .meta-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            font-weight: 500;
        }

        .meta-location {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .term-purpose {
            margin-bottom: 15px;
        }

        .term-purpose h4 {
            color: #37474f;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .term-purpose p {
            color: #546e7a;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .term-explanation {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-bottom: 15px;
        }

        .term-explanation h4 {
            color: #37474f;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .term-explanation p {
            color: #546e7a;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .term-implication {
            margin-bottom: 15px;
        }

        .term-implication h4 {
            color: #37474f;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .term-implication p {
            color: #546e7a;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .term-conditions {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .term-conditions h4 {
            color: #37474f;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .term-conditions ul {
            color: #546e7a;
            line-height: 1.5;
            font-size: 0.95em;
            padding-left: 20px;
        }

        .term-relevance {
            margin-top: 15px;
        }

        .term-relevance h4 {
            color: #37474f;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .term-relevance p {
            color: #546e7a;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .highlight {
            background: #ffeb3b;
            padding: 1px 2px;
            border-radius: 2px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-results-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .controls {
                padding: 20px;
            }

            .control-group {
                grid-template-columns: 1fr;
            }

            .term-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stats {
                justify-content: center;
            }
        }
    </style>
</head>

        <div class="content">

            </div>
        </div>
    </div>

        // Variables for filtering and rendering
        let currentData = thresholdData;
        let filteredItems = [...thresholdData];
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const termGrid = document.getElementById('termGrid');
        const noResults = document.getElementById('noResults');
        const totalCount = document.getElementById('totalCount');
        const filteredCount = document.getElementById('filteredCount');
        const thresholdsBtn = document.getElementById('thresholdsBtn');
        const conditionsBtn = document.getElementById('conditionsBtn');

        // Initialize filters
        function initializeFilters() {
            // Clear existing options
            while (categoryFilter.options.length > 1) {
                categoryFilter.remove(1);
            }

            // Get unique categories from current data
            const categories = [...new Set(currentData.map(item => item.category))].sort();
            
            // Add options to category filter
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });

            // Update counts
            totalCount.textContent = `Total: ${currentData.length} items`;
            filteredCount.textContent = `Showing: ${filteredItems.length} items`;
        }

        // Highlight search text
        function highlightText(text, query) {
            if (!query) return text;
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Render items
        function renderItems() {
            termGrid.innerHTML = '';

            if (filteredItems.length === 0) {
                noResults.style.display = 'block';
                termGrid.style.display = 'none';
            } else {
                noResults.style.display = 'none';
                termGrid.style.display = 'grid';

                const searchQuery = searchInput.value.toLowerCase();

                filteredItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'term-card';

                    if (item.type === 'threshold') {
                        // Render threshold card
                        card.innerHTML = `
                            <div class="term-header">
                                <div class="term-name">${highlightText(item.name, searchQuery)}</div>
                                <div class="term-category">${highlightText(item.subcategory, searchQuery)}</div>
                            </div>
                            <div class="term-purpose">
                                <h4>Purpose</h4>
                                <p>${highlightText(item.purpose, searchQuery)}</p>
                            </div>
                            <div class="term-explanation">
                                <h4>${item.explanation.includes('Mathematical') ? 'Mathematical Explanation' : 'Explanation'}</h4>
                                <p>${highlightText(item.explanation, searchQuery)}</p>
                            </div>
                            <div class="term-implication">
                                <h4>Practical Implication</h4>
                                <p>${highlightText(item.implication, searchQuery)}</p>
                            </div>
                        `;
                    } else {
                        // Render condition card
                        card.innerHTML = `
                            <div class="term-header">
                                <div class="term-name">${highlightText(item.name, searchQuery)}</div>
                                <div class="term-category">${highlightText(item.category, searchQuery)}</div>
                                <div class="term-meta">
                                    <span class="meta-badge meta-location">${highlightText(item.location, searchQuery)}</span>
                                </div>
                            </div>
                            <div class="term-conditions">
                                <h4>Initial Conditions Required</h4>
                                <ul>
                                    ${item.conditions.map(condition => `<li>${highlightText(condition, searchQuery)}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="term-relevance">
                                <h4>Relevance</h4>
                                <p>${highlightText(item.relevance, searchQuery)}</p>
                            </div>
                        `;
                    }

                    termGrid.appendChild(card);
                });
            }

            filteredCount.textContent = `Showing: ${filteredItems.length} items`;
        }

        // Filter items
        function filterItems() {
            const searchQuery = searchInput.value.toLowerCase();
            const categoryQuery = categoryFilter.value;

            filteredItems = currentData.filter(item => {
                // Search in all text fields
                const matchesSearch = !searchQuery || 
                    item.name.toLowerCase().includes(searchQuery) ||
                    item.category.toLowerCase().includes(searchQuery) ||
                    item.purpose?.toLowerCase().includes(searchQuery) ||
                    item.explanation?.toLowerCase().includes(searchQuery) ||
                    item.implication?.toLowerCase().includes(searchQuery) ||
                    item.location?.toLowerCase().includes(searchQuery) ||
                    item.relevance?.toLowerCase().includes(searchQuery) ||
                    (item.conditions && item.conditions.some(condition => condition.toLowerCase().includes(searchQuery)));

                // Filter by category
                const matchesCategory = !categoryQuery || item.category === categoryQuery;

                return matchesSearch && matchesCategory;
            });

            renderItems();
        }

        // Clear all filters
        function clearAllFilters() {
            searchInput.value = '';
            categoryFilter.value = '';
            filteredItems = [...currentData];
            renderItems();
        }

        // Toggle between thresholds and conditions
        function toggleDataType(type) {
            if (type === 'threshold') {
                currentData = thresholdData;
                thresholdsBtn.classList.add('active');
                conditionsBtn.classList.remove('active');
            } else {
                currentData = conditionData;
                thresholdsBtn.classList.remove('active');
                conditionsBtn.classList.add('active');
            }

            filteredItems = [...currentData];
            initializeFilters();
            renderItems();
        }

        // Event listeners
        searchInput.addEventListener('input', filterItems);
        categoryFilter.addEventListener('change', filterItems);
        thresholdsBtn.addEventListener('click', () => toggleDataType('threshold'));
        conditionsBtn.addEventListener('click', () => toggleDataType('condition'));

        // Initialize
        initializeFilters();
        renderItems();
    </script>
